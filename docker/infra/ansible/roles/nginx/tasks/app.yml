---
- name: Render upstream blue config for {{ app.name }}
  template:
    src:  upstream-blue.conf.j2
    dest: "{{ apps_root }}/{{ app.name }}/nginx/upstream-blue.conf"
    mode: '0644'

- name: Render upstream green config for {{ app.name }}
  template:
    src:  upstream-green.conf.j2
    dest: "{{ apps_root }}/{{ app.name }}/nginx/upstream-green.conf"
    mode: '0644'

- name: Render active upstream config (initially blue) for {{ app.name }}
  template:
    src:  upstream-blue.conf.j2
    dest: "/etc/nginx/conf.d/{{ app.name }}-upstream-active.conf"
    mode: '0644'
    force: false

- name: Render main site config for {{ app.name }}
  template:
    src:  site.conf.j2
    dest: "/etc/nginx/conf.d/{{ app.name }}.conf"
    mode: '0644'
