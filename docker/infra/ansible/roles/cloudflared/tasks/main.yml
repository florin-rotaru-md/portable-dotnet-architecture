- name: Validate required Cloudflare token
  assert:
    that:
      - cloudflare_token is defined
      - cloudflare_token | string | trim | length > 0
    fail_msg: >-
      Define cloudflare_token in inventory/group_vars/all/vault.yml before
      enabling use_cloudflared. Start from inventory/group_vars/all/vault.yml.example
      and encrypt the file with ansible-vault if needed.
  no_log: true

- name: Add Cloudflare apt signing key
  get_url:
    url:  https://pkg.cloudflare.com/cloudflare-main.gpg
    dest: /usr/share/keyrings/cloudflare-main.gpg
    mode: '0644'

- name: Add Cloudflare apt repository
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared {{ ansible_distribution_release }} main"
    state:    present
    filename: cloudflared
  ignore_errors: true   # fall back to generic Cloudflare repo if distro-specific repo missing

- name: Add Cloudflare apt repository (fallback)
  apt_repository:
    repo: >-
      deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg]
      https://pkg.cloudflare.com/cloudflared any main
    state:    present
    filename: cloudflared-any
  when: ansible_distribution_release not in ['bookworm', 'focal', 'jammy', 'noble']

# Pinned on purpose when cloudflared_version is set. This is the only public
# ingress, the service runs with --no-autoupdate, and unattended-upgrades does
# not cover the Cloudflare origin — so the binary moves when you decide it does.
# allow_downgrade makes a rollback the same variable bump in reverse.
# Unset/empty cloudflared_version = whatever the repository currently offers.
- name: Install cloudflared
  apt:
    name:            "cloudflared{{ ('=' ~ cloudflared_version) if (cloudflared_version | default('') | string | trim) else '' }}"
    state:           present
    update_cache:    true
    allow_downgrade: true
  notify: restart cloudflared

- name: Create cloudflared config directory
  file:
    path:  /etc/cloudflared
    state: directory
    owner: root
    group: root
    mode:  '0755'

- name: Write cloudflared token
  copy:
    dest:    /etc/cloudflared/token
    content: "{{ cloudflare_token }}"
    owner:   root
    group:   root
    mode:    '0600'
  no_log: true

- name: Install cloudflared systemd service
  template:
    src:  cloudflared.service.j2
    dest: /etc/systemd/system/cloudflared.service
    mode: '0644'
  notify: restart cloudflared

- name: Enable and start cloudflared
  systemd:
    name:          cloudflared
    enabled:       true
    state:         started
    daemon_reload: true
