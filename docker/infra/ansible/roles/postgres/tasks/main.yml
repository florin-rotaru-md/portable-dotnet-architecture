- name: Validate required postgres secrets
  assert:
    that:
      - postgres_root_password is defined
      - postgres_root_password | string | trim | length > 0
      - postgres_root_password != 'change-me-root-password'
      - postgres_password is defined
      - postgres_password | string | trim | length > 0
      - postgres_password != 'change-me-app-password'
    fail_msg: >-
      Define postgres_root_password and postgres_password in
      inventory/group_vars/all/vault.yml before running bootstrap.
      Start from inventory/group_vars/all/vault.yml.example and encrypt the file
      with ansible-vault if needed.
  no_log: true

- name: Ensure postgres directories exist
  file:
    path:  "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode:  '0755'
  loop:
    - /opt/postgres
    - /opt/postgres/backups
    - /opt/postgres/docker
    - /opt/postgres/scripts

- name: Render postgres compose file
  template:
    src:   compose.postgres.yml.j2
    dest:  /opt/postgres/docker/compose.postgres.yml
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode:  '0640'

- name: Write postgres root password env file
  copy:
    dest:    /opt/postgres/docker/postgres.env
    content: "POSTGRES_PASSWORD={{ postgres_root_password }}\n"
    owner:   "{{ app_user }}"
    group:   "{{ app_user }}"
    mode:    '0600'
  no_log: true

- name: Start postgres container
  community.docker.docker_compose_v2:
    project_src:    /opt/postgres/docker
    files:
      - compose.postgres.yml
    state:          present
    pull:           always

- name: Wait for postgres to accept connections
  community.docker.docker_container_exec:
    container: postgres
    command:   pg_isready -U postgres
  register: pg_ready
  until:    pg_ready.rc == 0
  retries:  15
  delay:    2

- name: Check if app user exists
  community.docker.docker_container_exec:
    container: postgres
    command:   psql -U postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='{{ postgres_user }}'"
  register: pg_user_check
  changed_when: false

- name: Create app user
  community.docker.docker_container_exec:
    container: postgres
    command: >
      psql -U postgres -c
      "CREATE USER {{ postgres_user }} WITH PASSWORD '{{ postgres_password }}' CREATEDB"
  when: pg_user_check.stdout | trim != '1'
  no_log: true

- name: Enable postgis extension on template1 (inherited by all new databases)
  community.docker.docker_container_exec:
    container: postgres
    command: psql -U postgres -d template1 -c "CREATE EXTENSION IF NOT EXISTS postgis"
  changed_when: false

- name: Install backup script
  template:
    src:   pg-backup.sh.j2
    dest:  /opt/postgres/scripts/pg-backup.sh
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode:  '0755'

- name: Schedule nightly backup cron job
  cron:
    name:   "postgres backup all databases"
    minute: "30"
    hour:   "2"
    user:   "{{ app_user }}"
    job:    "/opt/postgres/scripts/pg-backup.sh >> /opt/postgres/backups/cron.log 2>&1"
