---
- name: Install base packages
  apt:
    name:
      - curl
      - git
      - wget
      - unzip
      - jq
      - ufw
      - ca-certificates
      - gnupg
      - lsb-release
      - rsync
    state: present
    update_cache: true

- name: Ensure deploy group exists
  group:
    name: "{{ app_user }}"
    state: present

- name: Ensure deploy user exists
  user:
    name:        "{{ app_user }}"
    group:       "{{ app_user }}"
    shell:       /bin/bash
    create_home: true

- name: Grant deploy passwordless sudo
  copy:
    dest:    /etc/sudoers.d/deploy
    content: "{{ app_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner:   root
    group:   root
    mode:    '0440'
    validate: 'visudo -cf %s'

- name: Allow configured TCP ports through UFW
  ufw:
    rule:  allow
    port:  "{{ item }}"
    proto: tcp
  loop: "{{ ufw_allowed_tcp_ports | default([]) }}"

- name: Enable UFW
  ufw:
    state: enabled

- name: Ensure ansible group exists
  group:
    name:  ansible
    state: present

- name: Ensure ansible user exists
  user:
    name:        ansible
    group:       ansible
    shell:       /bin/bash
    create_home: true

- name: Grant ansible user passwordless sudo
  copy:
    dest:     /etc/sudoers.d/ansible
    content:  "ansible ALL=(ALL) NOPASSWD:ALL\n"
    owner:    root
    group:    root
    mode:     '0440'
    validate: 'visudo -cf %s'

- name: Set up ansible SSH authorized key
  authorized_key:
    user:  ansible
    state: present
    key:   "{{ ansible_ssh_public_key }}"
  when: ansible_ssh_public_key is defined
