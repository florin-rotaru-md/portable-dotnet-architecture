---
- name: Install Nginx
  apt:
    name: nginx
    state: present
    update_cache: true

- name: Ensure nginx runtime directory exists
  file:
    path: "{{ nginx_runtime_root }}"
    state: directory
    mode: '0755'

- name: Render upstream blue config
  template:
    src: upstream-blue.conf.j2
    dest: "{{ nginx_runtime_root }}/upstream-blue.conf"
    mode: '0644'

- name: Render upstream green config
  template:
    src: upstream-green.conf.j2
    dest: "{{ nginx_runtime_root }}/upstream-green.conf"
    mode: '0644'

- name: Render active upstream config initially to blue
  template:
    src: upstream-blue.conf.j2
    dest: /etc/nginx/conf.d/upstream-active.conf
    mode: '0644'
  args:
    creates: /etc/nginx/conf.d/upstream-active.conf

- name: Render main site config
  template:
    src: site.conf.j2
    dest: /etc/nginx/conf.d/myapp.conf
    mode: '0644'

- name: Validate nginx config
  command: nginx -t
  changed_when: false

- name: Ensure nginx is enabled and running
  service:
    name: nginx
    enabled: true
    state: started
