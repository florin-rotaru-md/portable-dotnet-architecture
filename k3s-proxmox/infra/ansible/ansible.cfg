[defaults]
# No inventory default: the inventory lives outside the clone (see the setup README).
# Point Ansible at yours with `export ANSIBLE_INVENTORY=~/app-inventory/hosts.ini` or `-i`.
# Committing that default here is what used to make every control-node `git pull` a
# conflict against the operator's own edits.
# Reuse the Ansible roles from k3s/ — they are identical.
roles_path         = ../../k3s/infra/ansible/roles
remote_user        = ops
host_key_checking  = False
interpreter_python = auto_silent
stdout_callback    = default
result_format      = yaml

[privilege_escalation]
become          = True
become_method   = sudo
become_ask_pass = False
