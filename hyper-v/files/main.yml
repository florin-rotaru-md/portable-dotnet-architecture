---
# Hyper-V starter for native/ on a local or home-lab LAN.

# ── Ansible service account ────────────────────────────────────────────────────
ansible_user: devops
# ansible_ssh_public_key (+ optional ansible_ssh_extra_public_keys) come from vault.yml

# Once EVERY key you rely on is listed in vault.yml, flip to true: keys not in
# the list are removed on the next run — key rotation = one playbook run.
# Include the keys seeded outside Ansible (hypervisor root, installer-imported)
# or the first run deletes them; check first with:
#   ansible all -m command -a 'cat ~/.ssh/authorized_keys' -b --become-user devops
ssh_authorized_keys_exclusive: false

# Grow the root partition/LVM/filesystem into whatever the hypervisor granted —
# a no-op when nothing changed, so it runs on every host, every run. LVM layouts
# only: cloud-image guests grow themselves via cloud-init — set false there
# (proxmox-lab Stage 11).
grow_root_filesystem: true

# ── Infrastructure ─────────────────────────────────────────────────────────────
app_user: devops
apps_root: /opt/apps
app_log_root: /var/log
dotnet_version: "10.0"

# ── Postgres ───────────────────────────────────────────────────────────────────
postgres_version: "18"
postgis_major_version: "3"
postgres_user: postgres
backup_retention_days: 7

# Minor releases (18.1 -> 18.2) install automatically via unattended-upgrades
# with the PGDG origin; majors always require a deliberate postgres_version bump.
postgres_auto_minor_upgrades: true

# ── Postgres tuning (conf.d/10-tuning.conf) ───────────────────────────────────
# max_connections is policy, not RAM: it follows the Maximum Pool Size caps in
# the connection strings, and the window that sizes it is a deploy, not rush
# hour:
#
#   steady     = the sum, over every deployment sharing this cluster, of that
#                deployment's own per-instance pools
#   worst case = steady + the largest single deployment's pools, because for
#                the length of a deploy the outgoing and incoming instances of
#                that one deployment both hold their own (a blue/green drain,
#                a rolling update — the same window)
#
# read against max_connections less superuser_reserved_connections (Postgres'
# default is 3), with headroom left for psql/monitoring/backup. Not one
# per-instance total multiplied by an application count and doubled, which this
# file used to say: that charges the smallest deployment at the largest one's
# size and assumes every application drains at the same moment. That all-drain
# sum is worth computing as a secondary check; it is not the verdict.
#
# Deploys taken one at a time are what make the worst case the worst case, and
# that stays an honour system: whatever serialises deploys does, not the
# database. A per-deployment non-superuser role with its own CONNECTION LIMIT
# is what would enforce it. Where every deployment instead connects as
# postgres, a superuser, both superuser_reserved_connections and
# ALTER DATABASE ... CONNECTION LIMIT are unenforced and the starvation hole is
# open: one application can take every slot on the server, starve the others
# and lock the operator out of the database it saturated. Subtracting the
# reserve keeps the budget conservative rather than reserving anything from
# anybody; the only cap that binds is Maximum Pool Size on each connection
# string, which is client-side and always enforced.
#
# A RAM upgrade does not move it; another deployment does. The live estate's
# own worked table lives in the live inventory and in native/example;
# perf/load-drill.sh recomputes it from scenarios/endpoints.json and fails the
# run when it stops fitting.
postgres_max_connections: 400

# Everything else derives from the host's RAM on every playbook run
# (shared_buffers 25%, effective_cache_size 75%, work_mem and
# maintenance_work_mem step up at 48GB) — growing the VM and re-running
# bootstrap is the whole tuning upgrade. Override only when the derived value
# is wrong for the workload:
# postgres_shared_buffers:           "8GB"
# postgres_effective_cache_size:     "24GB"
# postgres_work_mem:                 "32MB"
# postgres_maintenance_work_mem:     "1GB"
# postgres_max_wal_size:             "4GB"
# postgres_random_page_cost:         "1.1"
# postgres_effective_io_concurrency: "200"
# postgres_wal_compression:          "lz4"

# Nightly logical dump schedule — keep it BEFORE any VM-image/checkpoint backup.
postgres_backup_hour:   "2"
postgres_backup_minute: "15"

# IP that the app VM uses to reach the postgres VM.
# Update to match the static IP you assigned to postgres-ubuntu in Hyper-V.
postgres_host: "192.168.0.22"

# Subnet allowed to connect to PostgreSQL over TCP.
# The postgres role opens UFW port 5432 and adds a pg_hba.conf entry for this CIDR.
# Must include the app VM IP (192.168.0.21).
postgres_app_cidr: "192.168.0.0/24"

# Additional client CIDRs beyond postgres_app_cidr (workstation pgAdmin/psql
# access etc.). The /24 above already covers the whole LAN, so this usually
# stays empty here.
postgres_extra_cidrs: []

# ── WAL streaming to a third box (optional) ────────────────────────────────────
# Streams the write-ahead log to an always-on receiver (pg_receivewal), so an
# unplanned failover loses seconds instead of the VM-replication interval.
# Receiver setup + the recovery procedure: proxmox-lab/ha/13-wal-stream.md
postgres_wal_stream_enabled: false
postgres_wal_stream_user: "walreceiver"
postgres_wal_stream_slot: "wal_archive"
# The receiver's address as a CIDR, e.g. "192.168.0.10/32" (the QDevice)
postgres_wal_stream_cidr: ""
# Safety valve: max WAL retained for a disconnected receiver, so a dead
# receiver breaks the stream instead of filling the database disk.
postgres_max_slot_wal_keep_size: "10GB"
# postgres_wal_stream_password comes from vault.yml when enabled

# ── Postgres backup disk (optional, recommended on Hyper-V) ───────────────────
# Attach a second VHDX (or pass-through disk) to the postgres VM, pointing to a
# different physical disk than the OS VHDX. The role will mkfs.ext4 it on first
# run (only if empty), mount it, persist in /etc/fstab, and target it for dumps.
# Leave these unset/commented to keep backups on the OS disk under
# /opt/postgres/backups.

#postgres_backup_device: /dev/sdb            # bare block device inside the VM
#postgres_backup_mount:  /mnt/pgbackups      # mount target inside the VM
#postgres_backup_label:  pgbackups           # ext4 label used at mkfs time

# ── Cloudflare (optional) ──────────────────────────────────────────────────────
use_cloudflared: false

# ── Loki + Grafana (optional, Docker on dedicated VM) ────────────────────────
use_loki_grafana: true
# Where to run Loki/Grafana:
#   app        = install on the app host (default, single-VM style)
#   monitoring = install on hosts in [monitoring] group (dedicated VM)
monitoring_target: monitoring
monitoring_root: /opt/monitoring
monitoring_bind_address: "127.0.0.1"
loki_bind_address: "0.0.0.0"
grafana_bind_address: "0.0.0.0"
monitoring_allowed_cidr: "192.168.0.0/24"
loki_image: "grafana/loki:3.0.0"
grafana_image: "grafana/grafana:11.1.4"
grafana_port: 3000
loki_port: 3100
grafana_admin_user: admin
grafana_loki_datasource_name: "Loki"
grafana_loki_datasource_url: "http://loki:3100"
grafana_loki_is_default: true

# ── Grafana Alloy on app VM (logs -> Loki on monitoring VM) ──────────────────
alloy_http_port: 12345
alloy_logs_root: "{{ app_log_root }}"
alloy_log_glob: "*.log"
# Optional explicit override for dedicated monitoring VM:
# alloy_loki_url: "http://192.168.0.23:3100/loki/api/v1/push"

# ── Firewall ───────────────────────────────────────────────────────────────────
ufw_allowed_tcp_ports:
  - "22"
  - "80"
  - "443"

# ── Native multi-app mode ──────────────────────────────────────────────────────
health_max_attempts: 16
health_interval_seconds: 4

applications:
  - name: api.example.local
    log_dir_name: api.example.local
    assembly: MyApp.Api
    domain: api.example.local
    port_blue: 5000
    port_green: 5001
    drain_seconds: 20
    repo_url: "https://github.com/your-org/your-app.git"
    repo_branch: "main"
    project_path: "src/MyApp.Api/MyApp.Api.csproj"
    # repo_token: "{{ app_repo_token }}"
    appsettings_override:
      # Levels only — and only for an app that calls ReadFrom.Configuration; anything written
      # here reaches a logger built purely in code as inert JSON. Platform-based apps read this
      # section, having already applied their own baseline, so what follows raises a category
      # back up for the length of an incident without a deploy.
      #
      # Do NOT add Using / WriteTo / Enrich / Properties. Serilog *adds* sinks read from
      # configuration to the ones the app configured, it never substitutes for them: a WriteTo
      # block writes every event a second time, and that copy bypasses the async wrapper that
      # keeps file writes off the request threads. The path, rolling interval and retention are
      # the app's to declare, so that a config file which goes missing cannot lift them.
      Serilog:
        MinimumLevel:
          Default: Information
          Override:
            Microsoft: Warning
            Microsoft.Hosting.Lifetime: Information
            System: Warning
            # Every SQL statement the app executes, each line carrying the command twice. Raise
            # to Information only while chasing a query, and put it back afterwards.
            Microsoft.EntityFrameworkCore.Database.Command: Warning
      # Where the app writes, and what to. Absolute, and matching the directory the app role
      # creates and the unit grants write access to — a relative value would land inside the slot,
      # which deploy.sh empties on every release, and which Alloy does not tail. The file name gets
      # the SLOT_NAME the units export, so blue and green never open the same file during a drain.
      #
      # FileEnabled/ConsoleEnabled pick the destinations: leave them alone on a systemd host, and
      # set FileEnabled false + ConsoleEnabled true where stdout is collected instead (a container).
      # Turning both off is not a way to disable logging — the console comes back on rather than
      # leave the process writing nowhere.
      Diagnostics:
        LogsDirectory: "{{ app_log_root }}/api.example.local"
      # Status code at or above which a request log keeps the request/response body. 400 keeps
      # them for failures only, 0 logs every body, 500 narrows to server faults.
      RequestLogging:
        BodyMinimumStatusCode: 400
      # Npgsql keeps one pool per unique connection string; Maximum Pool Size
      # caps each pool, and postgres_max_connections above carries the
      # arithmetic that turns these per-deployment totals into a server
      # ceiling. The pool is a ceiling, not a target: Npgsql opens
      # connections on demand, and past what the database can execute at once
      # a larger pool only moves the queue from the application into Postgres.
      # Keepalive=60 lets the pool detect and evict connections killed by a
      # Postgres restart (auto minor upgrades) before requests trip over them.
      # Timeout=5 fails a request that cannot get a connection rather than
      # pinning a Kestrel thread for the default 15s; Command Timeout=30 bounds
      # one bad query; Connection Idle Lifetime=60 hands slots back four
      # minutes sooner than the default, which is what keeps the drain window's
      # worst case theoretical.
      ConnectionStrings:
        Main: "Host={{ postgres_host }};Port=5432;Database=myapp_main;Username={{ postgres_user }};Password={{ postgres_password }};Pooling=true;Keepalive=60;Maximum Pool Size=64;Timeout=5;Command Timeout=30;Connection Idle Lifetime=60"
      # No Logging:LogLevel here on purpose: UseSerilog() replaces the logging provider with one
      # that never consults LoggerFilterOptions, so that section filters nothing. Levels are the
      # Serilog block above.
    env:
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ASPNETCORE_ENVIRONMENT: "Production"

