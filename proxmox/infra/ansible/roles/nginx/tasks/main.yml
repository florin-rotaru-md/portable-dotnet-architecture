---
- name: Install Nginx
  apt:
    name: nginx
    state: present
    update_cache: true

- name: Remove legacy shared upstream config
  file:
    path: /etc/nginx/conf.d/upstream-active.conf
    state: absent

- name: Render per-application nginx configs
  include_tasks: app.yml
  loop: "{{ applications }}"
  loop_control:
    loop_var: app

- name: Validate nginx config
  command: nginx -t
  changed_when: false

- name: Ensure nginx is enabled and running
  service:
    name: nginx
    enabled: true
    state: started
