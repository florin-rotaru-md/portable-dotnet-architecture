---
- name: Install base packages
  apt:
    name:
      - curl
      - git
      - wget
      - unzip
      - jq
      - ufw
      - ca-certificates
      - gnupg
      - lsb-release
      - fail2ban
      - htop
    state: present
    update_cache: true

- name: Allow SSH through UFW
  ufw:
    rule:  allow
    port:  "22"
    proto: tcp

- name: Enable UFW
  ufw:
    state: enabled

- name: Enable fail2ban
  service:
    name:    fail2ban
    enabled: true
    state:   started

- name: Ensure ansible group exists
  group:
    name:  ansible
    state: present

- name: Ensure ansible user exists
  user:
    name:        ansible
    group:       ansible
    shell:       /bin/bash
    create_home: true

- name: Grant ansible user passwordless sudo
  copy:
    dest:     /etc/sudoers.d/ansible
    content:  "ansible ALL=(ALL) NOPASSWD:ALL\n"
    owner:    root
    group:    root
    mode:     '0440'
    validate: 'visudo -cf %s'

- name: Set up ansible SSH authorized key
  authorized_key:
    user:  ansible
    state: present
    key:   "{{ ansible_ssh_public_key }}"
  when: ansible_ssh_public_key is defined
