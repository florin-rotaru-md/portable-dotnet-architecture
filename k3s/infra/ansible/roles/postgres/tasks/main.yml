- name: Validate required postgres and backup secrets
  assert:
    that:
      - postgres_password is defined
      - postgres_password | string | trim | length > 0
      - postgres_password != 'change-me-strong-password'
      - s3_access_key is defined
      - s3_access_key | string | trim | length > 0
      - s3_access_key != 'AKIAIOSFODNN7EXAMPLE'
      - s3_secret_key is defined
      - s3_secret_key | string | trim | length > 0
      - s3_secret_key != 'wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY'
    fail_msg: >-
      Define postgres_password, s3_access_key, and s3_secret_key in
      inventory/group_vars/all/vault.yml before running bootstrap. Start from
      inventory/group_vars/all/vault.yml.example and encrypt the file with
      ansible-vault if needed.
  no_log: true

- name: Add PostgreSQL apt key
  get_url:
    url:  https://www.postgresql.org/media/keys/ACCC4CF8.asc
    dest: /usr/share/keyrings/postgresql.asc
    mode: '0644'

- name: Add PostgreSQL apt repository
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/postgresql.asc] http://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main"
    state:    present
    filename: pgdg

# state: latest so any playbook run converges to the current minor release.
# It can never cross a major boundary — the package name embeds the major.
- name: Install PostgreSQL and PostGIS
  apt:
    name:
      - "postgresql-{{ postgres_version }}"
      - "postgresql-{{ postgres_version }}-postgis-3"
    state:        latest
    update_cache: true

# Automatic minor upgrades between playbook runs: unattended-upgrades with the
# PGDG origin. Disable with postgres_auto_minor_upgrades: false in group_vars.
- name: Install unattended-upgrades
  apt:
    name:  unattended-upgrades
    state: present
  when: postgres_auto_minor_upgrades | default(true)

- name: Allow PGDG origin in unattended-upgrades
  template:
    src:   51pgdg-unattended-upgrades.j2
    dest:  /etc/apt/apt.conf.d/51pgdg-unattended-upgrades
    owner: root
    group: root
    mode:  '0644'
  when: postgres_auto_minor_upgrades | default(true)

- name: Enable daily unattended-upgrade runs
  copy:
    dest:    /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode:  '0644'
  when: postgres_auto_minor_upgrades | default(true)

- name: Remove PGDG unattended-upgrades config when disabled
  file:
    path:  /etc/apt/apt.conf.d/51pgdg-unattended-upgrades
    state: absent
  when: not (postgres_auto_minor_upgrades | default(true))

- name: Configure pg_hba.conf
  template:
    src:   pg_hba.conf.j2
    dest:  "/etc/postgresql/{{ postgres_version }}/main/pg_hba.conf"
    owner: postgres
    group: postgres
    mode:  '0640'
  notify: restart postgresql

- name: Set listen_addresses to cluster private network
  lineinfile:
    path:   "/etc/postgresql/{{ postgres_version }}/main/postgresql.conf"
    regexp: '^#?listen_addresses\s*='
    line:   "listen_addresses = '127.0.0.1,{{ postgres_private_ip }}'"
  notify: restart postgresql

- name: Allow k3s nodes to reach Postgres on private network
  ufw:
    rule:  allow
    port:  "5432"
    proto: tcp
    src:   "10.0.1.0/24"

- name: Ensure PostgreSQL is enabled and started
  service:
    name:    postgresql
    enabled: true
    state:   started

- name: Check if app user exists
  become_user: postgres
  command: psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='{{ postgres_user }}'"
  register: pg_user
  changed_when: false

- name: Create app user
  become_user: postgres
  command: >
    psql -c "CREATE USER {{ postgres_user }}
             WITH PASSWORD '{{ postgres_password }}' CREATEDB"
  when:   pg_user.stdout != '1'
  no_log: true

- name: Enable postgis extension on template1 (inherited by new databases)
  become_user: postgres
  command: psql -d template1 -c "CREATE EXTENSION IF NOT EXISTS postgis"
  changed_when: false

- name: Ensure backup directories exist
  file:
    path:  "{{ item }}"
    state: directory
    owner: postgres
    group: postgres
    mode:  '0750'
  loop:
    - /opt/postgres/backups
    - /opt/postgres/scripts

- name: Install S3 backup script
  template:
    src:   pg-backup.sh.j2
    dest:  /opt/postgres/scripts/pg-backup.sh
    owner: postgres
    group: postgres
    mode:  '0750'
  no_log: true

# Schedule is policy, so it lives in group_vars; defaults keep 02:15.
- name: Install S3 backup cron job
  cron:
    name:   "postgres nightly S3 backup"
    user:   postgres
    minute: "{{ postgres_backup_minute | default('15') }}"
    hour:   "{{ postgres_backup_hour | default('2') }}"
    job:    "/opt/postgres/scripts/pg-backup.sh >> /opt/postgres/backups/cron.log 2>&1"
  no_log: true
