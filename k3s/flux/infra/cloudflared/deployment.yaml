apiVersion: v1
kind: Namespace
metadata:
  name: cloudflared
---
# Create this Secret externally (not committed to Git):
# kubectl create secret generic cloudflare-tunnel-token \
#   --from-literal=token=<your-token> \
#   -n cloudflared
#
# Or use a SealedSecret / ExternalSecret if you have those operators.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-tunnel-token
                  key:  token
          resources:
            requests:
              cpu:    10m
              memory: 32Mi
            limits:
              cpu:    200m
              memory: 128Mi
      restartPolicy: Always
