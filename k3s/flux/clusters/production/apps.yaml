apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 5m
  dependsOn:
    - name: infra          # apps deploy only after infra is healthy
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./k3s/flux/apps
  prune: true
  wait: true
  timeout: 5m
