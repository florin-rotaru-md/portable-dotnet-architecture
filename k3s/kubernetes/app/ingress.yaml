apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-api
  namespace: app
spec:
  ingressClassName: traefik
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-api
                port:
                  number: 80
