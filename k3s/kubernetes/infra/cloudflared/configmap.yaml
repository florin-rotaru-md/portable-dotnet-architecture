apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: infra
data:
  config.yaml: |
    tunnel: TUNNEL_ID
    credentials-file: /etc/cloudflared/creds/credentials.json
    ingress:
      - hostname: api.example.com
        service: http://traefik.kube-system.svc.cluster.local:80
      - service: http_status:404
