[app]
your-app-vps-ip ansible_user=devops ansible_private_key_file=~/.ssh/id_ed25519_devops

[postgres]
your-postgres-vps-ip ansible_user=devops ansible_private_key_file=~/.ssh/id_ed25519_devops

# Examples:
# 1.2.3.4 ansible_user=devops ansible_private_key_file=~/.ssh/id_ed25519_devops
# 1.2.3.5 ansible_user=devops ansible_private_key_file=~/.ssh/id_ed25519_devops

# First bootstrap (before devops user exists) — use the initial admin account:
# your-app-vps-ip      ansible_user=ubuntu ansible_private_key_file=~/.ssh/id_ed25519_devops
# your-postgres-vps-ip ansible_user=ubuntu ansible_private_key_file=~/.ssh/id_ed25519_devops
