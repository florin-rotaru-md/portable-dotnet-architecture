---
# Deploy a new version of one application (or every repo-based one) from the
# control node. The host reads the repository with its own deploy key
# (roles/app/tasks/deploy_keys.yml), so no credential is typed or travels with the run.
#
#   ansible-playbook playbooks/deploy.yml -e app=api.waa.ro    # one app, its branch's tip
#   ansible-playbook playbooks/deploy.yml                      # all repo-based apps
#   ansible-playbook playbooks/deploy.yml -e app=api.waa.ro -e commit=<full hash>
#       # that commit and no other: a release names it once and passes it to every app, so a
#       # push made while the release runs cannot give two apps different source
#   # encrypted vault: add --ask-vault-pass
#
# Requires bootstrap.yml to have run at least once (it renders deploy.sh).
- name: Deploy applications (blue/green)
  hosts: app
  become: "{{ ansible_user != 'root' }}"
  pre_tasks:
    - name: Ensure applications are defined
      assert:
        that:
          - applications is defined
          - applications | length > 0
        fail_msg: >-
          Define at least one application in your inventory's group_vars/all/main.yml
          under the applications list.

    - name: Select repo-based applications
      set_fact:
        deploy_apps: >-
          {{ applications
             | selectattr('repo_url', 'defined')
             | selectattr('project_path', 'defined')
             | rejectattr('repo_url', 'equalto', '')
             | rejectattr('project_path', 'equalto', '')
             | list }}

    - name: Limit to the requested app
      set_fact:
        deploy_apps: "{{ deploy_apps | selectattr('name', 'equalto', app) | list }}"
      when: app is defined

    - name: Ensure a named commit is a full hash
      assert:
        that:
          - commit is match('^[0-9a-f]{40}$')
        fail_msg: "commit must be a full 40-character hash, as 'git rev-parse HEAD' prints it."
      when: commit is defined

    - name: Ensure there is something to deploy
      assert:
        that:
          - deploy_apps | length > 0
        fail_msg: >-
          No application with repo_url + project_path matched{% if app is defined %} name '{{ app }}'{% endif %}.

  tasks:
    # The loop runs over application NAMES, never over the application dicts. A loop's `item` is
    # part of every result Ansible prints — always for `assert`, and for any module the moment an
    # item fails — and `loop_control.label` only shortens the header line above it. An application
    # dict carries its whole config bundle, so a loop over the dicts prints the JWT signing key and
    # the bundle's other secrets.
    - name: Run deploy.sh (build → idle slot → health check → switch)
      vars:
        deploy_app: "{{ deploy_apps | selectattr('name', 'equalto', item) | first }}"
      command:
        argv: >-
          {{ [apps_root ~ '/' ~ item ~ '/scripts/deploy.sh',
              '--repo-url', deploy_app.repo_url,
              '--branch', deploy_app.repo_branch | default('master'),
              '--project-path', deploy_app.project_path]
             + (['--commit', commit] if commit is defined else []) }}
      become_user: "{{ app_user }}"
      loop: "{{ deploy_apps | map(attribute='name') | list }}"
      register: deploy_results

    - name: Deploy summary
      debug:
        # `true`: an empty list counts as missing too — what a --check run leaves behind.
        msg: "{{ item.stdout_lines | default(['(no output)'], true) | last }}"
      loop: "{{ deploy_results.results }}"
      loop_control:
        label: "{{ item.item }}"
