---
# Deploy a new version of one application (or every repo-based one) from the
# control node — the repo token comes straight from vault.yml, nothing is
# typed and nothing extra lands on the VM.
#
#   ansible-playbook playbooks/deploy.yml -e app=api.waa.ro    # one app
#   ansible-playbook playbooks/deploy.yml                      # all repo-based apps
#   # encrypted vault: add --ask-vault-pass
#
# Requires bootstrap.yml to have run at least once (it renders deploy.sh).
- name: Deploy applications (blue/green)
  hosts: app
  become: "{{ ansible_user != 'root' }}"
  pre_tasks:
    - name: Ensure applications are defined
      assert:
        that:
          - applications is defined
          - applications | length > 0
        fail_msg: >-
          Define at least one application in your inventory's group_vars/all/main.yml
          under the applications list.

    - name: Select repo-based applications
      set_fact:
        deploy_apps: >-
          {{ applications
             | selectattr('repo_url', 'defined')
             | selectattr('project_path', 'defined')
             | rejectattr('repo_url', 'equalto', '')
             | rejectattr('project_path', 'equalto', '')
             | list }}

    - name: Limit to the requested app
      set_fact:
        deploy_apps: "{{ deploy_apps | selectattr('name', 'equalto', app) | list }}"
      when: app is defined

    - name: Ensure there is something to deploy
      assert:
        that:
          - deploy_apps | length > 0
        fail_msg: >-
          No application with repo_url + project_path matched{% if app is defined %} name '{{ app }}'{% endif %}.

    # Both loops below run over application NAMES, never over the application dicts. A loop's
    # `item` is part of every result Ansible prints — always for `assert`, and for any module the
    # moment an item fails — and `loop_control.label` only shortens the header line above it. An
    # application dict carries its whole config bundle and repo_token, so looping over the dicts
    # printed the JWT signing key, the bundle's other secrets and the token on every deploy.
    - name: Validate repository credentials
      vars:
        deploy_app: "{{ deploy_apps | selectattr('name', 'equalto', item) | first }}"
      assert:
        that:
          - deploy_app.repo_token | default('') | string | trim | length > 0
          - deploy_app.repo_token | string | trim != 'ghp_...'
        fail_msg: >-
          Invalid repo_token for {{ item }}. Set a real token in vault.yml
          (fine-grained PAT, Contents read-only) — not empty, not the placeholder.
      loop: "{{ deploy_apps | map(attribute='name') | list }}"

  tasks:
    - name: Run deploy.sh (build → idle slot → health check → switch)
      vars:
        deploy_app: "{{ deploy_apps | selectattr('name', 'equalto', item) | first }}"
      command:
        argv:
          - "{{ apps_root }}/{{ item }}/scripts/deploy.sh"
          - --repo-url
          - "{{ deploy_app.repo_url }}"
          - --branch
          - "{{ deploy_app.repo_branch | default('master') }}"
          - --project-path
          - "{{ deploy_app.project_path }}"
      environment:
        APP_REPO_TOKEN: "{{ deploy_app.repo_token }}"
      become_user: "{{ app_user }}"
      loop: "{{ deploy_apps | map(attribute='name') | list }}"
      register: deploy_results

    - name: Deploy summary
      debug:
        # `true`: an empty list counts as missing too — what a --check run leaves behind.
        msg: "{{ item.stdout_lines | default(['(no output)'], true) | last }}"
      loop: "{{ deploy_results.results }}"
      loop_control:
        label: "{{ item.item }}"
