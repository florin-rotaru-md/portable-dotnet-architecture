---
- name: Render upstream blue config
  template:
    src:  upstream-blue.conf.j2
    dest: "{{ apps_root }}/{{ current_app.name }}/nginx/upstream-blue.conf"
    mode: '0644'
  vars:
    app_name: "{{ current_app.name }}"
    app_port_blue: "{{ current_app.port_blue | default(app_port_blue) }}"

- name: Render upstream green config
  template:
    src:  upstream-green.conf.j2
    dest: "{{ apps_root }}/{{ current_app.name }}/nginx/upstream-green.conf"
    mode: '0644'
  vars:
    app_name: "{{ current_app.name }}"
    app_port_green: "{{ current_app.port_green | default(app_port_green) }}"

- name: Render active upstream config (initially blue)
  template:
    src:  upstream-blue.conf.j2
    dest: "/etc/nginx/conf.d/{{ current_app.name }}-upstream-active.conf"
    mode: '0644'
    force: false
  vars:
    app_name: "{{ current_app.name }}"
    app_port_blue: "{{ current_app.port_blue | default(app_port_blue) }}"

- name: Render site config
  template:
    src:  site.conf.j2
    dest: "/etc/nginx/conf.d/{{ current_app.name }}.conf"
    mode: '0644'
  vars:
    app_name: "{{ current_app.name }}"
    app_domain: "{{ current_app.domain | default(app_domain) }}"
  notify: reload nginx
