---
- name: Install Nginx
  apt:
    name:         nginx
    state:        present
    update_cache: true

- name: Remove default Nginx site
  file:
    path:  /etc/nginx/sites-enabled/default
    state: absent

- name: Render Nginx configs for native app instances
  include_tasks: nginx_instance.yml
  loop: "{{ native_apps }}"
  loop_control:
    loop_var: current_app
    label: "{{ current_app.name }}"


# An app that a SIBLING app addresses by name over the local hop needs that name to resolve to
# this host, or the call leaves the machine. That is not hypothetical: both Waa APIs reach the
# ledger at `Fiscal:Endpoint = http://fiscal.waa.ro/` (platform Apps/Waa/Waa.Server/appsettings.waa.ro.json),
# deliberately by NAME rather than by loopback port, because a FiscalServer deploy switches nginx
# from one slot to the other and an app pinned to a slot port would lose its drain mid-switch.
# Without the entry the name resolves publicly, and what answers is not a refusal but Cloudflare:
# a 301 to https that HttpClient follows, carrying the key over a plaintext first hop and turning a
# POST into a GET (seen 2026-10-09 → 2026-10-21, platform/docs/fiscal/OPERATIONS.md#open-operational-work).
#
# Until 2026-09-07 the entry was a line somebody typed into /etc/hosts by hand. Nothing here
# managed it, so a rebuilt VM came back without it and the first symptom would have been invoices
# failing to reach the ledger — at whatever moment the rebuild happened to be.
#
# Writing it once is not enough either: cloud-init regenerates /etc/hosts on every boot
# (`manage_etc_hosts: true` comes from Proxmox's NoCloud user-data, which outranks anything under
# /etc/cloud), so a reboot drops it. The script below is therefore rendered as a host command and
# run three ways: at every boot by its own unit, ordered after cloud-init and before the app slots;
# here on every bootstrap; and by every app's deploy.sh before it builds
# (roles/app/templates/deploy.sh.j2). It owns the list and the block's format; no caller writes
# the file itself.
#
# It is opt-in per app rather than applied to every domain, because making a domain resolve locally
# is a behaviour change for anything on this host that means to reach it through the public path.
# Only an app that is genuinely addressed by a sibling declares `resolve_locally: true`.
#
# Portability, since this deployment is expected to move to a cloud host: in that world the same
# rule is a private DNS record or a service name, and the flag comes off. What must not change is
# that the caller keeps addressing the callee by NAME.
- name: Render the local-domain resolver
  vars:
    local_domains: "{{ native_apps | selectattr('resolve_locally', 'defined') | selectattr('resolve_locally') | map(attribute='domain') | list }}"
  template:
    src:   ensure-local-domains.sh.j2
    dest:  /usr/local/sbin/ensure-local-domains
    owner: root
    group: root
    mode:  '0755'

# Skipped under --check like any command; the template task above shows the list it would apply.
- name: Resolve locally-addressed app domains to this host
  command: /usr/local/sbin/ensure-local-domains
  register: local_domains_result
  changed_when: "'written' in local_domains_result.stdout"

# The boot-time run: after cloud-init's rewrite, before any app slot starts.
- name: Install the boot-time local-domain unit
  template:
    src:   ensure-local-domains.service.j2
    dest:  /etc/systemd/system/ensure-local-domains.service
    owner: root
    group: root
    mode:  '0644'
  register: local_domains_unit

# Started as well as enabled, so `systemctl status` and its journal answer from the first bootstrap
# rather than from the first reboot. RemainAfterExit keeps a later bootstrap from re-running it;
# the command task above is the bootstrap's own run. Under --check a unit that is only about to be
# written does not exist yet, and systemd would refuse to find it.
- name: Enable the boot-time local-domain unit
  systemd:
    name:          ensure-local-domains.service
    enabled:       true
    state:         started
    daemon_reload: "{{ local_domains_unit is changed }}"
  when: not (ansible_check_mode and local_domains_unit is changed)

- name: Validate nginx config
  command: nginx -t
  changed_when: false

- name: Ensure nginx is enabled and started
  service:
    name:    nginx
    enabled: true
    state:   started
