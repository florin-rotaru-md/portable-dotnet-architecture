---
- name: Install Nginx
  apt:
    name:         nginx
    state:        present
    update_cache: true

- name: Remove default Nginx site
  file:
    path:  /etc/nginx/sites-enabled/default
    state: absent

- name: Render upstream blue config
  template:
    src:  upstream-blue.conf.j2
    dest: "/opt/apps/{{ app_name }}/nginx/upstream-blue.conf"
    mode: '0644'

- name: Render upstream green config
  template:
    src:  upstream-green.conf.j2
    dest: "/opt/apps/{{ app_name }}/nginx/upstream-green.conf"
    mode: '0644'

- name: Render active upstream config (initially blue)
  template:
    src:  upstream-blue.conf.j2
    dest: "/etc/nginx/conf.d/{{ app_name }}-upstream-active.conf"
    mode: '0644'
    force: false

- name: Render site config
  template:
    src:  site.conf.j2
    dest: "/etc/nginx/conf.d/{{ app_name }}.conf"
    mode: '0644'
  notify: reload nginx

- name: Validate nginx config
  command: nginx -t
  changed_when: false

- name: Ensure nginx is enabled and started
  service:
    name:    nginx
    enabled: true
    state:   started
