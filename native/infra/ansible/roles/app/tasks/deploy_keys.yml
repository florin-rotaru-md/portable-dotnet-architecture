---
# The host reads each repository over SSH with a GitHub deploy key of its own: generated here,
# never copied off the host, valid for that one repository and read-only on GitHub's side. No
# repository credential is in the inventory, so there is none to store, rotate or print.
#
# GitHub has to be given the public half once per key: repository → Settings → Deploy keys, with
# "Allow write access" left unchecked. A rebuilt host generates new keys, and the last task below
# prints every key that did not get through, on every run.

- name: Name the repositories the applications are built from
  set_fact:
    app_repositories: >-
      {{ native_apps | map(attribute='repo_url', default='') | select
         | map('regex_replace', '^https://github[.]com/', '')
         | map('regex_replace', '[.]git$', '')
         | unique | list }}

# Named on its own: created as a parent of the key directory it would take that directory's mode.
- name: Ensure the applications directory exists
  file:
    path:  "{{ apps_root }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode:  '0755'

- name: Ensure the deploy key directory exists
  file:
    path:  "{{ app_deploy_keys_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode:  '0700'

- name: Ensure a directory exists for each repository owner
  file:
    path:  "{{ app_deploy_keys_dir }}/{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode:  '0700'
  loop: "{{ app_repositories | map('dirname') | unique | list }}"

- name: Pin GitHub's SSH host key
  copy:
    dest:    "{{ app_deploy_keys_dir }}/known_hosts"
    content: "github.com {{ github_ssh_host_key }}\n"
    owner:   "{{ app_user }}"
    group:   "{{ app_user }}"
    mode:    '0644'

# Everything SSH is told when a repository is read, in one file: deploy.sh and the check below pass
# it with -F, so neither the user's nor the system's SSH configuration takes part.
- name: Render the SSH options the deploy keys are used with
  copy:
    dest:    "{{ app_deploy_keys_dir }}/ssh_config"
    content: |
      Host github.com
        User git
        IdentitiesOnly yes
        BatchMode yes
        StrictHostKeyChecking yes
        UserKnownHostsFile {{ app_deploy_keys_dir }}/known_hosts
        ConnectTimeout 16
    owner:   "{{ app_user }}"
    group:   "{{ app_user }}"
    mode:    '0644'

- name: Generate a deploy key for each repository
  command:
    argv:
      - ssh-keygen
      - -q
      - -t
      - ed25519
      - -N
      - ""
      - -C
      - "{{ ansible_facts['hostname'] }} reads {{ item }}"
      - -f
      - "{{ app_deploy_keys_dir }}/{{ item }}"
    creates: "{{ app_deploy_keys_dir }}/{{ item }}"
  become_user: "{{ app_user }}"
  loop: "{{ app_repositories }}"

- name: Read each repository with its deploy key
  command:
    argv:
      - git
      - ls-remote
      - --quiet
      - "git@github.com:{{ item }}.git"
      - HEAD
  environment:
    GIT_SSH_COMMAND: "ssh -F {{ app_deploy_keys_dir }}/ssh_config -i {{ app_deploy_keys_dir }}/{{ item }}"
  become_user: "{{ app_user }}"
  loop: "{{ app_repositories }}"
  register: deploy_key_access
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read the keys that did not get through
  command:
    argv:
      - cat
      - "{{ app_deploy_keys_dir }}/{{ item.item }}.pub"
  loop: "{{ deploy_key_access.results | rejectattr('rc', 'equalto', 0) | list }}"
  loop_control:
    label: "{{ item.item }}"
  register: unread_repositories
  changed_when: false
  failed_when: false
  check_mode: false

# Said, not failed: the rest of the host is configured either way, GitHub being out of reach must
# not stop a configuration change, and a deploy stops on its own, with the same key, before it
# touches a slot.
- name: Say what each of them needs
  debug:
    msg:
      - "This host could not read {{ item.item.item }} with its deploy key; a deploy from that repository fails the same way."
      - "The answer was: {{ item.item.stderr_lines | default([], true) | first | default(item.item.msg | default('none'), true) }}"
      - "If GitHub has not been given the key, add it at https://github.com/{{ item.item.item }}/settings/keys/new, with 'Allow write access' unchecked:"
      - "{{ item.stdout | default('(generated by a run outside check mode)', true) }}"
  loop: "{{ unread_repositories.results }}"
  loop_control:
    label: "{{ item.item.item }}"
