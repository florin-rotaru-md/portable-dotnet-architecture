---
- name: Ensure app directory tree exists
  file:
    path:  "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode:  '0755'
  loop:
    - "{{ apps_root }}/{{ app_name }}"
    - "{{ apps_root }}/{{ app_name }}/slots/blue"
    - "{{ apps_root }}/{{ app_name }}/slots/green"
    - "{{ apps_root }}/{{ app_name }}/build"
    - "{{ apps_root }}/{{ app_name }}/env"
    - "{{ apps_root }}/{{ app_name }}/scripts"
    - "{{ apps_root }}/{{ app_name }}/nginx"
    - "{{ apps_root }}/{{ app_name }}/runtime"

- name: Render common env file
  template:
    src:   config.env.j2
    dest:  "{{ apps_root }}/{{ app_name }}/env/common.env"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode:  '0600'
    force: false          # do not overwrite if already customized

- name: Render blue env file
  copy:
    dest:    "{{ apps_root }}/{{ app_name }}/env/blue.env"
    content: "SLOT_NAME=blue\nASPNETCORE_URLS=http://127.0.0.1:{{ app_port_blue }}\n"
    owner:   "{{ app_user }}"
    group:   "{{ app_user }}"
    mode:    '0600'
    force:   false

- name: Render green env file
  copy:
    dest:    "{{ apps_root }}/{{ app_name }}/env/green.env"
    content: "SLOT_NAME=green\nASPNETCORE_URLS=http://127.0.0.1:{{ app_port_green }}\n"
    owner:   "{{ app_user }}"
    group:   "{{ app_user }}"
    mode:    '0600'
    force:   false

- name: Initialize active-slot file
  copy:
    dest:  "{{ apps_root }}/{{ app_name }}/runtime/active-slot"
    content: "blue\n"
    owner:  "{{ app_user }}"
    group:  "{{ app_user }}"
    mode:   '0644'
    force:  false

- name: Render runtime scripts
  template:
    src:   "{{ item }}"
    dest:  "{{ apps_root }}/{{ app_name }}/scripts/{{ item | regex_replace('\\.j2$', '') }}"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode:  '0755'
  loop:
    - current-slot.sh.j2
    - switch-nginx.sh.j2
    - health-check.sh.j2
    - deploy.sh.j2
    - rollback.sh.j2

- name: Install systemd service for blue slot
  template:
    src:  app-slot.service.j2
    dest: "/etc/systemd/system/{{ app_name }}-blue.service"
    mode: '0644'
  vars:
    slot:      blue
    slot_port: "{{ app_port_blue }}"
  notify: reload systemd

- name: Install systemd service for green slot
  template:
    src:  app-slot.service.j2
    dest: "/etc/systemd/system/{{ app_name }}-green.service"
    mode: '0644'
  vars:
    slot:      green
    slot_port: "{{ app_port_green }}"
  notify: reload systemd

- name: Enable (but do not start) slot services
  systemd:
    name:    "{{ app_name }}-{{ item }}.service"
    enabled: true
    daemon_reload: true
  loop:
    - blue
    - green
