---
- name: Ensure app directory tree exists
  file:
    path:  "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode:  '0755'
  loop:
    - "{{ apps_root }}/{{ current_app.name }}"
    - "{{ apps_root }}/{{ current_app.name }}/slots/blue"
    - "{{ apps_root }}/{{ current_app.name }}/slots/green"
    - "{{ apps_root }}/{{ current_app.name }}/build"
    - "{{ apps_root }}/{{ current_app.name }}/env"
    - "{{ apps_root }}/{{ current_app.name }}/config"
    - "{{ apps_root }}/{{ current_app.name }}/scripts"
    - "{{ apps_root }}/{{ current_app.name }}/nginx"
    - "{{ apps_root }}/{{ current_app.name }}/runtime"

# The app creates and rolls its own files in here, one name per slot. The role only has to make
# the directory exist and belong to the service user — a placeholder app.log used to be created
# too, which no app ever wrote to, so Alloy tailed an empty file for ever and it showed up in
# every log listing as a file that never had anything in it.
- name: Ensure app log directory exists
  file:
    path: "{{ app_log_root }}/{{ current_app.log_dir_name | default(current_app.name) }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

# force: true, like appsettings.override.json below — this file is generated in full from
# applications[].env, so the inventory is its only source of truth. It used to be force: false,
# which meant the file was written once at app creation and never again: an app provisioned before
# a variable was added to env[] kept running without it for ever. That is how api.waa.ro lost
# APP_PROFILE — the app silently skipped its optional appsettings.{APP_PROFILE}.json and died at
# boot on the two settings only that file carries. Hand-edits on the host do not survive a run;
# the inventory is where an env var belongs.
- name: Render common env file
  template:
    src:   config.env.j2
    dest:  "{{ apps_root }}/{{ current_app.name }}/env/common.env"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode:  '0600'
    force: true
  vars:
    app_name: "{{ current_app.name }}"
    app_env: "{{ current_app.env | default({}) }}"
  register: common_env_render

- name: Write appsettings.override.json for {{ current_app.name }}
  copy:
    dest:    "{{ apps_root }}/{{ current_app.name }}/config/appsettings.override.json"
    content: "{{ current_app.appsettings_override | default({}) | to_nice_json }}\n"
    owner:   "{{ app_user }}"
    group:   "{{ app_user }}"
    mode:    '0600'
    force:   true
  no_log: true

- name: Write repo token for {{ current_app.name }}
  copy:
    dest:    "{{ apps_root }}/{{ current_app.name }}/config/repo-token"
    content: "{{ current_app.repo_token | string | trim }}\n"
    owner:   "{{ app_user }}"
    group:   "{{ app_user }}"
    mode:    '0600'
  no_log: true
  when: current_app.repo_token | default('') | string | trim | length > 0

- name: Remove repo token when not configured
  file:
    path:  "{{ apps_root }}/{{ current_app.name }}/config/repo-token"
    state: absent
  when: current_app.repo_token | default('') | string | trim | length == 0

- name: Sync appsettings.override.json into blue/green slots
  copy:
    src: "{{ apps_root }}/{{ current_app.name }}/config/appsettings.override.json"
    dest: "{{ apps_root }}/{{ current_app.name }}/slots/{{ item }}/appsettings.override.json"
    remote_src: true
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0600"
  loop:
    - blue
    - green
  register: slot_override_sync
  no_log: true

# Rendered before the restart decision below, and force: true for the same reason common.env is:
# the port comes from the inventory, so a port_blue/port_green change has to reach the file. Left
# force: false, the nginx upstream moved to the new port and the app kept binding the old one.
- name: Render blue env file
  copy:
    dest:    "{{ apps_root }}/{{ current_app.name }}/env/blue.env"
    content: "SLOT_NAME=blue\nASPNETCORE_URLS=http://127.0.0.1:{{ current_app.port_blue }}\n"
    owner:   "{{ app_user }}"
    group:   "{{ app_user }}"
    mode:    '0600'
    force:   true
  register: blue_env_render

- name: Render green env file
  copy:
    dest:    "{{ apps_root }}/{{ current_app.name }}/env/green.env"
    content: "SLOT_NAME=green\nASPNETCORE_URLS=http://127.0.0.1:{{ current_app.port_green }}\n"
    owner:   "{{ app_user }}"
    group:   "{{ app_user }}"
    mode:    '0600'
    force:   true
  register: green_env_render

- name: Read active slot
  slurp:
    src: "{{ apps_root }}/{{ current_app.name }}/runtime/active-slot"
  register: active_slot_raw
  changed_when: false
  failed_when: false

- name: Resolve active slot name
  set_fact:
    active_slot_name: >-
      {{ (active_slot_raw.content | b64decode | trim)
         if (active_slot_raw.content is defined and (active_slot_raw.content | length > 0))
         else 'blue' }}

- name: Check whether active slot service is running
  command: systemctl is-active --quiet {{ current_app.name }}-{{ active_slot_name }}.service
  register: active_slot_service_state
  changed_when: false
  failed_when: false

# The env files too, not just the override: systemd reads EnvironmentFile at start, so a changed
# common.env / <slot>.env reaches the process only through a restart — and an env var the app needs
# at boot (APP_PROFILE) would otherwise land on disk and change nothing until the next deploy.
- name: Restart active slot service to apply new override or env
  systemd:
    name: "{{ current_app.name }}-{{ active_slot_name }}.service"
    state: restarted
  when:
    - slot_override_sync is changed
      or common_env_render is changed
      or blue_env_render is changed
      or green_env_render is changed
    - active_slot_service_state.rc == 0

# Read by rollback.sh to health-check the slot it falls back to. Inventory-derived, so force: true —
# a stale port here aims the rollback health check at nothing and reports the rollback as failed.
- name: Persist slot port metadata
  copy:
    dest:    "{{ apps_root }}/{{ current_app.name }}/runtime/port-{{ item.slot }}"
    content: "{{ item.port }}\n"
    owner:   "{{ app_user }}"
    group:   "{{ app_user }}"
    mode:    '0644'
    force:   true
  loop:
    - { slot: 'blue',  port: "{{ current_app.port_blue }}" }
    - { slot: 'green', port: "{{ current_app.port_green }}" }

# The one file here that force: false is right for: it is runtime state, owned by switch-nginx.sh,
# not something the inventory describes. Rewriting it on every run would tell the scripts blue is
# live while nginx is pointing at green.
- name: Initialize active-slot file
  copy:
    dest:  "{{ apps_root }}/{{ current_app.name }}/runtime/active-slot"
    content: "blue\n"
    owner:  "{{ app_user }}"
    group:  "{{ app_user }}"
    mode:   '0644'
    force:  false

- name: Render runtime scripts
  template:
    src:   "{{ item }}"
    dest:  "{{ apps_root }}/{{ current_app.name }}/scripts/{{ item | regex_replace('\\.j2$', '') }}"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode:  '0755'
  loop:
    - current-slot.sh.j2
    - switch-nginx.sh.j2
    - health-check.sh.j2
    - deploy.sh.j2
    - rollback.sh.j2
  vars:
    app_name: "{{ current_app.name }}"
    app_assembly: "{{ current_app.runtime_assembly | default(((current_app.project_path | default('') | basename | regex_replace('\\.csproj$', '')) if (current_app.project_path | default('') | length > 0) else current_app.assembly)) }}"
    app_port_blue: "{{ current_app.port_blue }}"
    app_port_green: "{{ current_app.port_green }}"
    drain_seconds: "{{ current_app.drain_seconds }}"
    app_health_path: "{{ current_app.health_path | default(health_path | default('/.well-known/ready')) }}"
    app_health_max_attempts: "{{ current_app.health_max_attempts | default(health_max_attempts | default(16)) }}"
    app_health_interval_seconds: "{{ current_app.health_interval_seconds | default(health_interval_seconds | default(4)) }}"

- name: Install systemd service for blue slot
  template:
    src:  app-slot.service.j2
    dest: "/etc/systemd/system/{{ current_app.name }}-blue.service"
    mode: '0644'
  vars:
    app_name: "{{ current_app.name }}"
    app_assembly: "{{ current_app.runtime_assembly | default(((current_app.project_path | default('') | basename | regex_replace('\\.csproj$', '')) if (current_app.project_path | default('') | length > 0) else current_app.assembly)) }}"
    app_log_dir_name: "{{ current_app.log_dir_name | default(current_app.name) }}"
    drain_seconds: "{{ current_app.drain_seconds }}"
    slot:      blue
    slot_port: "{{ current_app.port_blue }}"
  notify: reload systemd

- name: Install systemd service for green slot
  template:
    src:  app-slot.service.j2
    dest: "/etc/systemd/system/{{ current_app.name }}-green.service"
    mode: '0644'
  vars:
    app_name: "{{ current_app.name }}"
    app_assembly: "{{ current_app.runtime_assembly | default(((current_app.project_path | default('') | basename | regex_replace('\\.csproj$', '')) if (current_app.project_path | default('') | length > 0) else current_app.assembly)) }}"
    app_log_dir_name: "{{ current_app.log_dir_name | default(current_app.name) }}"
    drain_seconds: "{{ current_app.drain_seconds }}"
    slot:      green
    slot_port: "{{ current_app.port_green }}"
  notify: reload systemd

- name: Enable (but do not start) slot services
  systemd:
    name:    "{{ current_app.name }}-{{ item }}.service"
    enabled: true
    daemon_reload: true
  loop:
    - blue
    - green
