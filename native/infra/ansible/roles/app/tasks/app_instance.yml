---
- name: Ensure app directory tree exists
  file:
    path:  "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode:  '0755'
  loop:
    - "{{ apps_root }}/{{ current_app.name }}"
    - "{{ apps_root }}/{{ current_app.name }}/slots/blue"
    - "{{ apps_root }}/{{ current_app.name }}/slots/green"
    - "{{ apps_root }}/{{ current_app.name }}/build"
    - "{{ apps_root }}/{{ current_app.name }}/env"
    - "{{ apps_root }}/{{ current_app.name }}/config"
    - "{{ apps_root }}/{{ current_app.name }}/scripts"
    - "{{ apps_root }}/{{ current_app.name }}/nginx"
    - "{{ apps_root }}/{{ current_app.name }}/runtime"

# The app creates and rolls its own files in here, one name per slot. The role only has to make
# the directory exist and belong to the service user — a placeholder app.log used to be created
# too, which no app ever wrote to, so Alloy tailed an empty file for ever and it showed up in
# every log listing as a file that never had anything in it.
- name: Ensure app log directory exists
  file:
    path: "{{ app_log_root }}/{{ current_app.log_dir_name | default(current_app.name) }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

# force: true, like appsettings.override.json below — this file is generated in full from
# applications[].env, so the inventory is its only source of truth. It used to be force: false,
# which meant the file was written once at app creation and never again: an app provisioned before
# a variable was added to env[] kept running without it for ever. That is how api.waa.ro lost
# APP_PROFILE — the app silently skipped its optional appsettings.{APP_PROFILE}.json and died at
# boot on the two settings only that file carries. Hand-edits on the host do not survive a run;
# the inventory is where an env var belongs.
- name: Render common env file
  template:
    src:   config.env.j2
    dest:  "{{ apps_root }}/{{ current_app.name }}/env/common.env"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode:  '0600'
    force: true
  vars:
    app_name: "{{ current_app.name }}"
    app_env: "{{ current_app.env | default({}) }}"
  register: common_env_render

- name: Write appsettings.override.json for {{ current_app.name }}
  copy:
    dest:    "{{ apps_root }}/{{ current_app.name }}/config/appsettings.override.json"
    content: "{{ current_app.appsettings_override | default({}) | to_nice_json }}\n"
    owner:   "{{ app_user }}"
    group:   "{{ app_user }}"
    mode:    '0600'
    force:   true
  no_log: true
  register: override_render

# Optional, and rendered on the controller so vault references inside it resolve. The application
# seeds its database from this file at first boot, for the config sections the database does not
# have yet — so a rebuilt database comes up configured instead of silently defaulted. It is a seed,
# not an apply: the app never overwrites a section that already exists, which is what keeps admin
# edits from being reverted by the next restart. An app without config_bundle_file is unaffected.
- name: Render config-bundle.json for {{ current_app.name }}
  template:
    src:   "{{ current_app.config_bundle_file }}"
    dest:  "{{ apps_root }}/{{ current_app.name }}/config/config-bundle.json"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode:  '0600'
    force: true
  no_log: true
  when: current_app.config_bundle_file | default('') | length > 0

- name: Remove config-bundle.json when not configured
  file:
    path:  "{{ apps_root }}/{{ current_app.name }}/config/config-bundle.json"
    state: absent
  when: current_app.config_bundle_file | default('') | length == 0

# The role writes configuration into config/ and env/ only, never into a slot. deploy.sh copies it
# into the idle slot while that slot is stopped, and the last task of this file calls it: the host
# reloads appsettings.override.json when the file changes, so a copy written under the serving
# process would hand it values no health check has seen.
#
# The one thing removed from the slots here is a bundle the inventory no longer declares. It is
# read only at boot, so taking it from under a running slot changes nothing until the next start —
# which is the point: that start must not seed from a file the inventory dropped.
- name: Remove config-bundle.json from the slots when not configured
  file:
    path:  "{{ apps_root }}/{{ current_app.name }}/slots/{{ item }}/config-bundle.json"
    state: absent
  loop:
    - blue
    - green
  when: current_app.config_bundle_file | default('') | length == 0

# force: true for the same reason common.env is: the port comes from the inventory, so a
# port_blue/port_green change has to reach the file. Left force: false, the nginx upstream moved to
# the new port and the app kept binding the old one.
- name: Render blue env file
  copy:
    dest:    "{{ apps_root }}/{{ current_app.name }}/env/blue.env"
    content: "SLOT_NAME=blue\nASPNETCORE_URLS=http://127.0.0.1:{{ current_app.port_blue }}\n"
    owner:   "{{ app_user }}"
    group:   "{{ app_user }}"
    mode:    '0600'
    force:   true
  register: blue_env_render

- name: Render green env file
  copy:
    dest:    "{{ apps_root }}/{{ current_app.name }}/env/green.env"
    content: "SLOT_NAME=green\nASPNETCORE_URLS=http://127.0.0.1:{{ current_app.port_green }}\n"
    owner:   "{{ app_user }}"
    group:   "{{ app_user }}"
    mode:    '0600'
    force:   true
  register: green_env_render

# Read by rollback.sh to health-check the slot it falls back to. Inventory-derived, so force: true —
# a stale port here aims the rollback health check at nothing and reports the rollback as failed.
- name: Persist slot port metadata
  copy:
    dest:    "{{ apps_root }}/{{ current_app.name }}/runtime/port-{{ item.slot }}"
    content: "{{ item.port }}\n"
    owner:   "{{ app_user }}"
    group:   "{{ app_user }}"
    mode:    '0644'
    force:   true
  loop:
    - { slot: 'blue',  port: "{{ current_app.port_blue }}" }
    - { slot: 'green', port: "{{ current_app.port_green }}" }

# The one file here that force: false is right for: it is runtime state, owned by switch-nginx.sh,
# not something the inventory describes. Rewriting it on every run would tell the scripts blue is
# live while nginx is pointing at green.
- name: Initialize active-slot file
  copy:
    dest:  "{{ apps_root }}/{{ current_app.name }}/runtime/active-slot"
    content: "blue\n"
    owner:  "{{ app_user }}"
    group:  "{{ app_user }}"
    mode:   '0644'
    force:  false

- name: Render runtime scripts
  template:
    src:   "{{ item }}"
    dest:  "{{ apps_root }}/{{ current_app.name }}/scripts/{{ item | regex_replace('\\.j2$', '') }}"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode:  '0755'
  loop:
    - current-slot.sh.j2
    - switch-nginx.sh.j2
    - health-check.sh.j2
    - deploy.sh.j2
    - rollback.sh.j2
  register: runtime_scripts_render
  vars:
    app_name: "{{ current_app.name }}"
    app_assembly: "{{ current_app.runtime_assembly | default(((current_app.project_path | default('') | basename | regex_replace('\\.csproj$', '')) if (current_app.project_path | default('') | length > 0) else current_app.assembly)) }}"
    app_port_blue: "{{ current_app.port_blue }}"
    app_port_green: "{{ current_app.port_green }}"
    # The same directory the log dir task creates and the units grant write access to. deploy.sh
    # reads the app's rolling log from here when a slot fails to come up.
    app_log_dir: "{{ app_log_root }}/{{ current_app.log_dir_name | default(current_app.name) }}"
    drain_seconds: "{{ current_app.drain_seconds }}"
    app_health_path: "{{ current_app.health_path | default(health_path | default('/.well-known/ready')) }}"
    app_health_max_attempts: "{{ current_app.health_max_attempts | default(health_max_attempts | default(16)) }}"
    app_health_interval_seconds: "{{ current_app.health_interval_seconds | default(health_interval_seconds | default(4)) }}"

- name: Install systemd service for blue slot
  template:
    src:  app-slot.service.j2
    dest: "/etc/systemd/system/{{ current_app.name }}-blue.service"
    mode: '0644'
  vars:
    app_name: "{{ current_app.name }}"
    app_assembly: "{{ current_app.runtime_assembly | default(((current_app.project_path | default('') | basename | regex_replace('\\.csproj$', '')) if (current_app.project_path | default('') | length > 0) else current_app.assembly)) }}"
    app_log_dir_name: "{{ current_app.log_dir_name | default(current_app.name) }}"
    drain_seconds: "{{ current_app.drain_seconds }}"
    slot:      blue
    slot_port: "{{ current_app.port_blue }}"
  notify: reload systemd

- name: Install systemd service for green slot
  template:
    src:  app-slot.service.j2
    dest: "/etc/systemd/system/{{ current_app.name }}-green.service"
    mode: '0644'
  vars:
    app_name: "{{ current_app.name }}"
    app_assembly: "{{ current_app.runtime_assembly | default(((current_app.project_path | default('') | basename | regex_replace('\\.csproj$', '')) if (current_app.project_path | default('') | length > 0) else current_app.assembly)) }}"
    app_log_dir_name: "{{ current_app.log_dir_name | default(current_app.name) }}"
    drain_seconds: "{{ current_app.drain_seconds }}"
    slot:      green
    slot_port: "{{ current_app.port_green }}"
  notify: reload systemd

# Enablement is deliberately NOT declared here. Which slot may start at boot is a property of which
# one is live, and only deploy.sh knows that — it enables the slot it switches nginx to and disables
# the one it drains. This task used to set `enabled: true` on both, so every reboot of the host
# started two slots of every app, on two different builds, competing for the same queues.
#
# Consequence to keep in mind: a freshly provisioned host has neither slot enabled until its first
# deploy, which is correct — there is nothing published to serve yet.
- name: Register slot services (enablement is owned by deploy.sh)
  systemd:
    name:    "{{ current_app.name }}-{{ item }}.service"
    daemon_reload: true
  loop:
    - blue
    - green

# Last, because it starts a slot: the scripts, the units and the port files above are what it runs
# with. A changed override or env file reaches users the way a build does — deploy.sh starts the
# idle slot with it, health-checks that slot and only then switches nginx — so a configuration the
# app refuses fails this task and leaves the serving slot as it was. The script decides whether
# there is anything to do, by comparing the files with what the serving slot was started with; an
# app that is not running is left for its next deploy.
- name: Apply configuration through the idle slot
  command:
    argv:
      - "{{ apps_root }}/{{ current_app.name }}/scripts/deploy.sh"
      - --config-only
  become_user: "{{ app_user }}"
  register: config_apply
  changed_when: "'Configuration applied' in config_apply.stdout"
  when: not ansible_check_mode

# A dry run changes no file, so the script would compare the old ones and report nothing pending.
# The files' own results say what this run would write; the script's --check adds a change an
# earlier run wrote and could not apply. It runs only when this run leaves the script itself alone:
# before that, the host has either no deploy.sh or one that does not know the flag.
- name: Ask deploy.sh whether configuration is pending (check mode)
  command:
    argv:
      - "{{ apps_root }}/{{ current_app.name }}/scripts/deploy.sh"
      - --config-only
      - --check
  become_user: "{{ app_user }}"
  register: config_apply_pending
  changed_when: false
  check_mode: false
  when:
    - ansible_check_mode
    - runtime_scripts_render is not changed

- name: Report the slot switch this run would cause (check mode)
  debug:
    msg: >-
      {{ current_app.name }}: the idle slot would be started with the new configuration and take
      over once it answers the health check.
  changed_when: true
  when:
    - ansible_check_mode
    - override_render is changed
      or common_env_render is changed
      or blue_env_render is changed
      or green_env_render is changed
      or 'Configuration is pending' in (config_apply_pending.stdout | default(''))
