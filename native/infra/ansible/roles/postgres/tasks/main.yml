- name: Validate required postgres secrets
  assert:
    that:
      - postgres_password is defined
      - postgres_password | string | trim | length > 0
      - postgres_password != 'change-me-strong-password'
    fail_msg: >-
      Define postgres_password in inventory/group_vars/all/vault.yml before
      running bootstrap. Start from inventory/group_vars/all/vault.yml.example and
      encrypt the file with ansible-vault if needed.
  no_log: true

- name: Add PostgreSQL apt signing key
  get_url:
    url:  https://www.postgresql.org/media/keys/ACCC4CF8.asc
    dest: /usr/share/keyrings/postgresql.asc
    mode: '0644'

- name: Add PostgreSQL apt repository
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/postgresql.asc] http://apt.postgresql.org/pub/repos/apt {{ ansible_facts['distribution_release'] }}-pgdg main"
    state:    present
    filename: pgdg

# state: latest so any playbook run converges to the current minor release.
# It can never cross a major boundary — the package name embeds the major.
- name: Install PostgreSQL and PostGIS
  apt:
    name:
      - "postgresql-{{ postgres_version }}"
      - "postgresql-{{ postgres_version }}-postgis-{{ postgis_major_version }}"
    state:        latest
    update_cache: true

# Automatic minor upgrades between playbook runs: unattended-upgrades with the
# PGDG origin. Disable with postgres_auto_minor_upgrades: false in group_vars.
- name: Install unattended-upgrades
  apt:
    name:  unattended-upgrades
    state: present
  when: postgres_auto_minor_upgrades | default(true)

- name: Allow PGDG origin in unattended-upgrades
  template:
    src:   51pgdg-unattended-upgrades.j2
    dest:  /etc/apt/apt.conf.d/51pgdg-unattended-upgrades
    owner: root
    group: root
    mode:  '0644'
  when: postgres_auto_minor_upgrades | default(true)

- name: Enable daily unattended-upgrade runs
  copy:
    dest:    /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode:  '0644'
  when: postgres_auto_minor_upgrades | default(true)

- name: Remove PGDG unattended-upgrades config when disabled
  file:
    path:  /etc/apt/apt.conf.d/51pgdg-unattended-upgrades
    state: absent
  when: not (postgres_auto_minor_upgrades | default(true))

# Reload, not restart: pg_hba.conf is re-read on SIGHUP. This file changes every
# time an access CIDR moves (app IP, extra clients, the WAL receiver), and those
# edits should not cost an outage. See the handlers file for why the distinction
# is enforced there rather than with `service: state: reloaded`.
- name: Configure pg_hba.conf (client authentication rules)
  template:
    src:   pg_hba.conf.j2
    dest:  "/etc/postgresql/{{ postgres_version }}/main/pg_hba.conf"
    owner: postgres
    group: postgres
    mode:  '0640'
  notify: reload postgresql

- name: Configure PostgreSQL to accept remote connections
  lineinfile:
    path:   "/etc/postgresql/{{ postgres_version }}/main/postgresql.conf"
    regexp: '^#?listen_addresses\s*='
    line:   "listen_addresses = '*'"
  notify: restart postgresql
  when: >-
    (postgres_app_cidr | default('') | length > 0)
    or (postgres_extra_cidrs | default([]) | length > 0)

# ── Resource tuning (conf.d drop-in) ─────────────────────────────────────────
# Debian packaging ships postgresql.conf with include_dir = 'conf.d' at the
# end of the file, so a drop-in overrides packaged defaults and the lineinfile
# edits above without ever owning the whole file — major upgrades keep working.
- name: Ensure conf.d include directory exists
  file:
    path:  "/etc/postgresql/{{ postgres_version }}/main/conf.d"
    state: directory
    owner: postgres
    group: postgres
    mode:  '0755'

- name: Ensure postgresql.conf includes conf.d
  lineinfile:
    path:   "/etc/postgresql/{{ postgres_version }}/main/postgresql.conf"
    regexp: "^#?include_dir\\s*=\\s*'conf\\.d'"
    line:   "include_dir = 'conf.d'"
  notify: restart postgresql

# max_connections, shared_buffers and shared_preload_libraries only apply on
# restart (not reload), which the notified handler already does.
- name: Apply resource tuning
  template:
    src:   tuning.conf.j2
    dest:  "/etc/postgresql/{{ postgres_version }}/main/conf.d/10-tuning.conf"
    owner: postgres
    group: postgres
    mode:  '0644'
  notify: restart postgresql

# The restart the tuning file just notified has to happen before the next task:
# CREATE EXTENSION works either way, but the view it creates raises "must be
# loaded via shared_preload_libraries" until the server has restarted with it,
# which reads like a broken install to whoever tries it first.
- name: Apply pending restarts before touching the database
  meta: flush_handlers

# The library counts for the whole cluster once preloaded; the extension is
# only the view to read it through. Creating it in the maintenance database is
# therefore enough for an operator — the rows carry a dbid and cover every
# database on the server — and it keeps the application databases free of an
# object no application uses.
- name: Check whether pg_stat_statements is readable from the maintenance database
  command:
    argv:
      - runuser
      - -u
      - postgres
      - --
      - psql
      - -tAc
      - "SELECT 1 FROM pg_extension WHERE extname='pg_stat_statements'"
  register: pg_stat_statements_check
  changed_when: false
  when: "'pg_stat_statements' in (postgres_shared_preload_libraries | default('pg_stat_statements', true))"

- name: Create the pg_stat_statements view
  command:
    argv:
      - runuser
      - -u
      - postgres
      - --
      - psql
      - -c
      - "CREATE EXTENSION pg_stat_statements"
  when:
    - "'pg_stat_statements' in (postgres_shared_preload_libraries | default('pg_stat_statements', true))"
    - pg_stat_statements_check.stdout | default('') | trim != '1'

- name: Allow PostgreSQL port through UFW from app subnet
  ufw:
    rule:  allow
    port:  "5432"
    proto: tcp
    src:   "{{ postgres_app_cidr }}"
  when: postgres_app_cidr | default('') | length > 0

# Entries removed from the list disappear from pg_hba.conf on the next run
# (the template owns the whole file), but UFW rules are only ever added —
# delete stale ones by hand: ufw status numbered && ufw delete <n>.
- name: Allow PostgreSQL port through UFW from extra client CIDRs
  ufw:
    rule:  allow
    port:  "5432"
    proto: tcp
    src:   "{{ item }}"
  loop: "{{ postgres_extra_cidrs | default([]) }}"

# ── Continuous WAL archiving and a weekly base backup (optional) ──────────────
# Point-in-time recovery for the whole cluster: every completed WAL file is
# compressed into a local spool, and a verified physical base backup is taken
# weekly. Nothing here ships anything off the VM — the hypervisor running it
# pulls both and uploads them offsite (proxmox-lab/backup/17-backup-restore.md,
# 17.4). Off by default: with nothing pulling, the spool grows until the archive
# script refuses at postgres_wal_spool_max_mb, and then pg_wal grows instead.

- name: Install zstd for WAL and base-backup compression
  apt:
    name:  zstd
    state: present
  when: postgres_wal_archive_enabled | default(false)

- name: Ensure the WAL spool, base-backup and scripts directories exist
  file:
    path:  "{{ item }}"
    state: directory
    owner: postgres
    group: postgres
    mode:  '0750'
  loop:
    - "{{ postgres_wal_spool_dir | default('/opt/postgres/wal-spool') }}"
    - "{{ postgres_basebackup_dir | default('/opt/postgres/base') }}"
    - /opt/postgres/scripts
  when: postgres_wal_archive_enabled | default(false)

# Installed before the configuration that calls them: archive_mode takes effect
# at the restart the next task notifies, and the first archive_command runs then.
- name: Install the WAL archive and base-backup scripts
  template:
    src:   "{{ item }}.j2"
    dest:  "/opt/postgres/scripts/{{ item }}"
    owner: postgres
    group: postgres
    mode:  '0750'
  loop:
    - pg-wal-archive.sh
    - pg-basebackup.sh
  when: postgres_wal_archive_enabled | default(false)

- name: Configure WAL archiving
  template:
    src:   archive.conf.j2
    dest:  "/etc/postgresql/{{ postgres_version }}/main/conf.d/20-archive.conf"
    owner: postgres
    group: postgres
    mode:  '0644'
  notify: restart postgresql
  when: postgres_wal_archive_enabled | default(false)

- name: Remove WAL archiving when disabled
  file:
    path:  "/etc/postgresql/{{ postgres_version }}/main/conf.d/20-archive.conf"
    state: absent
  notify: restart postgresql
  when: not (postgres_wal_archive_enabled | default(false))

- name: Ensure PostgreSQL is enabled and started
  service:
    name:    postgresql
    enabled: true
    state:   started

- name: Check if app DB user exists
  command:
    argv:
      - runuser
      - -u
      - postgres
      - --
      - psql
      - -tAc
      - "SELECT 1 FROM pg_roles WHERE rolname='{{ postgres_user }}'"
  register: pg_user_check
  changed_when: false

- name: Create app DB user
  command:
    argv:
      - runuser
      - -u
      - postgres
      - --
      - psql
      - -c
      - "CREATE USER {{ postgres_user }} WITH PASSWORD '{{ postgres_password }}' CREATEDB"
  when: pg_user_check.stdout != '1'
  no_log: true

- name: Ensure app DB user password and attributes
  command:
    argv:
      - runuser
      - -u
      - postgres
      - --
      - psql
      - -c
      - "ALTER ROLE {{ postgres_user }} WITH LOGIN CREATEDB PASSWORD '{{ postgres_password }}'"
  no_log: true

- name: Enable postgis extension on template1 (inherited by new databases)
  command:
    argv:
      - runuser
      - -u
      - postgres
      - --
      - psql
      - -d
      - template1
      - -c
      - CREATE EXTENSION IF NOT EXISTS postgis
  changed_when: false

- name: Prepare dedicated backup disk (optional)
  include_tasks: backup_disk.yml
  when:
    - postgres_backup_device is defined
    - postgres_backup_device | length > 0

- name: Resolve effective backup directory
  set_fact:
    postgres_backup_dir: >-
      {{
        (postgres_backup_mount ~ '/postgres')
        if (postgres_backup_device is defined and (postgres_backup_device | length > 0))
        else '/opt/postgres/backups'
      }}

- name: Ensure postgres backup + scripts directories exist
  file:
    path:  "{{ item }}"
    state: directory
    owner: postgres
    group: postgres
    mode:  '0750'
  loop:
    - "{{ postgres_backup_dir }}"
    - /opt/postgres/scripts

- name: Install backup script
  template:
    src:   pg-backup.sh.j2
    dest:  /opt/postgres/scripts/pg-backup.sh
    owner: postgres
    group: postgres
    mode:  '0750'

# Schedules are policy, so they live in group_vars, in the VM's own clock (UTC on
# the Proxmox build). The hypervisor pulls both results off the VM (17.4).
- name: Install backup cron job
  cron:
    name:   "postgres nightly backup"
    user:   postgres
    minute: "{{ postgres_backup_minute | default('15') }}"
    hour:   "{{ postgres_backup_hour | default('2') }}"
    job:    "/opt/postgres/scripts/pg-backup.sh >> {{ postgres_backup_dir }}/cron.log 2>&1"

- name: Install weekly base-backup cron job
  cron:
    name:    "postgres weekly base backup"
    user:    postgres
    weekday: "{{ postgres_basebackup_weekday | default('0') }}"
    hour:    "{{ postgres_basebackup_hour | default('2') }}"
    minute:  "{{ postgres_basebackup_minute | default('45') }}"
    job:     "/opt/postgres/scripts/pg-basebackup.sh >> {{ postgres_basebackup_dir | default('/opt/postgres/base') }}/basebackup.log 2>&1"
    state:   "{{ 'present' if (postgres_wal_archive_enabled | default(false)) else 'absent' }}"
