---
# Headless browser for server-side rendering (HTML → PNG/PDF via PuppeteerSharp, Playwright, …).
#
# Two decisions worth knowing before editing this file:
#
#   * On amd64 this installs Google's own .deb, NOT Ubuntu's `chromium` package. The latter is a
#     transitional shim for the snap, and a snap cannot be launched from a systemd unit with
#     ProtectSystem=strict by a non-login service user — it fails in a way that reads like a
#     Puppeteer bug for about a day. The .deb also pulls its own shared libraries, so there is no
#     hand-maintained list of libnss3/libgbm1/… to drift out of date.
#   * Nothing here lets the application download a browser at runtime. The version installed is an
#     operational decision, applied by a playbook run, not something that changes under a running
#     service.

- name: Install fonts for headless rendering
  apt:
    name:  "{{ headless_browser_fonts }}"
    state: present
    update_cache: true

# ── amd64: Google Chrome, with the apt source its package maintains ───────────
# The package owns its source: its postinst and daily cron job rewrite google-chrome.sources
# and /usr/share/keyrings/google-chrome.gpg, and delete a google-chrome.list. A source written
# here would be rewritten under the role, so the role installs Google's .deb once and later
# versions arrive through that source, like every other package upgrade.
- name: Remove the role-written Chrome source and key
  file:
    path:  "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/google-chrome.list
    - /etc/apt/keyrings/google-chrome.asc
  when: ansible_facts['architecture'] == 'x86_64'

- name: Check whether Google Chrome is installed
  stat:
    path: "{{ headless_browser_path_amd64 }}"
  register: google_chrome_binary
  when: ansible_facts['architecture'] == 'x86_64'

- name: Install Google Chrome
  apt:
    deb: https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
  when:
    - ansible_facts['architecture'] == 'x86_64'
    - not google_chrome_binary.stat.exists

# ── everything else (arm64): distribution Chromium ────────────────────────────
# Google publishes no Chrome build for arm64. On Debian `chromium` is a real .deb; on Ubuntu arm64
# it is the snap shim again, so verify the smoke test below actually passes on that combination
# before relying on it.
- name: Install Chromium (non-amd64)
  apt:
    name:  chromium
    state: present
  when: ansible_facts['architecture'] != 'x86_64'

- name: Resolve the installed browser path
  set_fact:
    headless_browser_path: >-
      {{ headless_browser_path_amd64
         if ansible_facts['architecture'] == 'x86_64'
         else headless_browser_path_other }}

# The smoke test, not a formality: it is what catches a snap shim, a missing shared library or a
# sandbox refusal here, during provisioning, instead of on the first customer download.
- name: Verify the browser runs headless
  command: >-
    {{ headless_browser_path }}
    --headless --no-sandbox --disable-gpu --disable-dev-shm-usage
    --dump-dom about:blank
  become_user: "{{ app_user }}"
  environment:
    HOME: /tmp
  changed_when: false
  register: headless_browser_smoke
  failed_when: headless_browser_smoke.rc != 0

- name: Report the browser path to configure
  debug:
    msg: >-
      Headless browser ready at {{ headless_browser_path }} —
      point the application's configuration at it (.NET/PuppeteerSharp: Render:BrowserExecutablePath).
