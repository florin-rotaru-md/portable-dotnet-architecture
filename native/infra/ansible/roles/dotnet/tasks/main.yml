---
# .NET comes from the distribution archive: Ubuntu 26.04 carries dotnet-sdk-10.0 itself, and
# Microsoft's feed for 26.04 publishes no .NET packages. The two feeds must not both offer the
# same packages (a host that mixes them ends up with hostfxr from one and the SDK from the
# other), so the role keeps no Microsoft source. A dotnet_version the archive does not carry
# fails the install below.
- name: Remove the Microsoft apt sources and key
  file:
    path:  "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/microsoft.list
    - /etc/apt/sources.list.d/microsoft-ubuntu.list
    - /usr/share/keyrings/microsoft.asc

- name: Install .NET SDK
  apt:
    name:         "dotnet-sdk-{{ dotnet_version }}"
    state:        present
    update_cache: true
