---
- name: Install base packages
  apt:
    name:
      - curl
      - git
      - wget
      - unzip
      - jq
      - ufw
      - ca-certificates
      - gnupg
      - lsb-release
      - rsync
    state: present
    update_cache: true

# Guests are cloned from one small template and each is grown to its own size at
# the hypervisor (Proxmox: qm resize). Inside, the partition / PV / LV / filesystem
# still have to follow, and cloud-init's growpart module won't do it because root
# sits on LVM. Every step below is a no-op once the filesystem already fills the
# disk, so this runs on every host, every time — a required step that can't be
# forgotten on the next VM. Set grow_root_filesystem: false to opt out.
- name: Grow the root filesystem into the whole disk
  when: grow_root_filesystem | default(true)
  block:
    - name: Ensure growpart is available
      apt:
        name: cloud-guest-utils
        state: present

    - name: Grow partition, physical volume, logical volume and filesystem
      shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail

          lv=$(findmnt -no SOURCE /)
          case "$lv" in
            /dev/mapper/*) ;;
            *) echo "SKIP: root ($lv) is not an LVM volume"; exit 0 ;;
          esac

          vg=$(lvs --noheadings -o vg_name "$lv" | tr -d '[:space:]')

          # One PV is the layout the template produces. More than one means
          # somebody added a disk to the VG by hand — bail out rather than guess.
          if [ "$(pvs --noheadings -o pv_name -S "vg_name=$vg" | wc -l)" -ne 1 ]; then
            echo "SKIP: VG $vg spans multiple physical volumes — grow it by hand"
            exit 0
          fi

          pv=$(pvs --noheadings -o pv_name -S "vg_name=$vg" | tr -d '[:space:]')
          disk="/dev/$(lsblk -no pkname "$pv" | tr -d '[:space:]')"
          partnum=${pv#"$disk"}
          partnum=${partnum//[!0-9]/}

          before=$(findmnt -bno SIZE /)

          # growpart exits 1 with NOCHANGE when the partition is already maximal
          if ! out=$(growpart "$disk" "$partnum" 2>&1); then
            grep -q NOCHANGE <<<"$out" || { echo "$out" >&2; exit 1; }
          fi

          pvresize "$pv"

          # lvextend exits 5 when there are no free extents to take
          if ! out=$(lvextend -l +100%FREE "$lv" 2>&1); then
            grep -qi -e 'matches existing size' -e 'Insufficient free space' <<<"$out" \
              || { echo "$out" >&2; exit 1; }
          fi

          resize2fs "$lv"

          after=$(findmnt -bno SIZE /)
          if [ "$before" = "$after" ]; then
            echo "NOCHANGE: root already fills the disk ($after bytes)"
          else
            echo "GREW: $before -> $after bytes"
          fi
      register: grow_root_result
      changed_when: "'GREW:' in grow_root_result.stdout"

- name: Ensure app user group exists
  group:
    name: "{{ app_user }}"
    state: present

- name: Ensure app user exists
  user:
    name:     "{{ app_user }}"
    group:    "{{ app_user }}"
    shell:    /bin/bash
    create_home: true

- name: Grant app user passwordless sudo
  copy:
    dest:    "/etc/sudoers.d/{{ app_user }}"
    content: "{{ app_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner:   root
    group:   root
    mode:    '0440'
    validate: 'visudo -cf %s'

- name: Allow configured TCP ports through UFW
  ufw:
    rule:  allow
    port:  "{{ item }}"
    proto: tcp
  loop: "{{ ufw_allowed_tcp_ports | default([]) }}"

- name: Enable UFW
  ufw:
    state: enabled

# A console password (e.g. Proxmox --cipassword) must never open password auth
# over SSH — cloud-init can flip ssh_pwauth on when a password is set. Pin
# key-only; the password keeps working at the console, and nowhere else.
- name: Keep SSH key-only (console password stays console-only)
  copy:
    dest:    /etc/ssh/sshd_config.d/99-key-only.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
    owner: root
    group: root
    mode:  '0644'
  when: ssh_disable_password_auth | default(true)
  notify: reload ssh

# Authorized keys are managed declaratively — add keys to
# ansible_ssh_extra_public_keys (workstation key, break-glass key) instead of
# editing ~/.ssh/authorized_keys by hand. One key is a single point of failure.
# With ssh_authorized_keys_exclusive: true, keys NOT listed are removed on the
# next run — key rotation becomes a playbook run. Enable it only after every
# key you rely on is in the list.
- name: Manage SSH authorized keys for {{ app_user }}
  authorized_key:
    user:      "{{ app_user }}"
    state:     present
    key:       "{{ _ssh_keys | join('\n') }}"
    exclusive: "{{ ssh_authorized_keys_exclusive | default(false) }}"
  vars:
    _ssh_keys: "{{ ([ansible_ssh_public_key] if ansible_ssh_public_key is defined else []) + (ansible_ssh_extra_public_keys | default([])) }}"
  when: _ssh_keys | length > 0
