---
- name: Ensure monitoring host exists when monitoring_target is dedicated
  assert:
    that:
      - groups['monitoring'] is defined
      - groups['monitoring'] | length > 0
    fail_msg: >-
      monitoring_target is set to monitoring, but inventory group [monitoring]
      is missing or empty.
  when: (monitoring_target | default('app')) == 'monitoring'

# apt refuses every update while a one-line .list and a .sources file name the same source
# with different keys, so the .list form and its key go before the .sources file is written.
- name: Remove the one-line Grafana source and its key
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/grafana.list
    - /etc/apt/keyrings/grafana.gpg

- name: Add Grafana apt repository
  deb822_repository:
    name: grafana
    uris: https://apt.grafana.com
    suites: stable
    components: main
    signed_by: https://apt.grafana.com/gpg.key

- name: Install Alloy
  apt:
    name: alloy
    state: present
    update_cache: true

- name: Bind Alloy HTTP server to loopback
  lineinfile:
    path: /etc/default/alloy
    regexp: '^CUSTOM_ARGS='
    line: 'CUSTOM_ARGS="--server.http.listen-addr=127.0.0.1:{{ alloy_http_port }}"'
  notify: restart alloy

- name: Render Alloy configuration
  template:
    src: config.alloy.j2
    dest: /etc/alloy/config.alloy
    owner: root
    group: root
    mode: "0644"
  notify: restart alloy

- name: Ensure Alloy service is enabled and started
  service:
    name: alloy
    state: started
    enabled: true
