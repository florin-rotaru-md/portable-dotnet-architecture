---
- name: Ensure monitoring host exists when monitoring_target is dedicated
  assert:
    that:
      - groups['monitoring'] is defined
      - groups['monitoring'] | length > 0
    fail_msg: >-
      monitoring_target is set to monitoring, but inventory group [monitoring]
      is missing or empty.
  when: (monitoring_target | default('app')) == 'monitoring'

- name: Install Grafana apt keyring dependencies
  apt:
    name:
      - apt-transport-https
      - software-properties-common
    state: present
    update_cache: true

- name: Ensure keyring directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Grafana repository key
  shell: |
    set -euo pipefail
    curl -fsSL https://apt.grafana.com/gpg.key | gpg --dearmor -o /etc/apt/keyrings/grafana.gpg
  args:
    executable: /bin/bash
    creates: /etc/apt/keyrings/grafana.gpg

- name: Add Grafana apt repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.gpg] https://apt.grafana.com stable main"
    filename: grafana
    state: present

- name: Install Alloy
  apt:
    name: alloy
    state: present
    update_cache: true

- name: Bind Alloy HTTP server to loopback
  lineinfile:
    path: /etc/default/alloy
    regexp: '^CUSTOM_ARGS='
    line: 'CUSTOM_ARGS="--server.http.listen-addr=127.0.0.1:{{ alloy_http_port }}"'
  notify: restart alloy

- name: Render Alloy configuration
  template:
    src: config.alloy.j2
    dest: /etc/alloy/config.alloy
    owner: root
    group: root
    mode: "0644"
  notify: restart alloy

- name: Ensure Alloy service is enabled and started
  service:
    name: alloy
    state: started
    enabled: true
