# Isolated Postgres for load drills — the same major and the same tuning the
# Ansible role renders in production, so a number measured here means something
# there. Nothing else runs in this file: the application under test is the real
# binary, started by hand or by deploy.sh against POSTGRES_HOST pointed here.
#
# Brought up and torn down by load-drill.sh; `docker compose up -d` works too.
#
#   PGPORT        host port to publish (default 55432 — deliberately not 5432, so
#                 a drill can never be pointed at a real local database by accident)
#   POSTGRES_IMAGE  the image, PostGIS-bearing by default and matching production's
#                 PostgreSQL and PostGIS majors
#   PGDATA_VOL  named volume; `docker compose down -v` discards it between drills

name: perf-drill

services:
  postgres:
    # PostGIS, not vanilla postgres. The cluster this mirrors carries the extension in
    # template1, so every application database inherits it — and Waa's actually needs it:
    # against a plain postgres image the app aborts at boot with exit 70,
    # `0A000: extension "postgis" is not available`, and pg_restore drops spatial_ref_sys
    # with "errors ignored" rather than failing. Both look like something else.
    # Keep the tag in step with production: PostgreSQL 18.6, PostGIS 3.6.4 as of 2026-09-05
    # (`SELECT extversion FROM pg_extension WHERE extname = 'postgis'`).
    image: ${POSTGRES_IMAGE:-postgis/postgis:18-3.6}
    container_name: perf-drill-postgres
    # Load the same conf.d layout the postgres role uses, so tuning.conf is the
    # only file that differs between this box and production.
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      # NOT `-c include_dir=...`: include_dir is a configuration-file directive, not a
      # settable parameter, and passing it on the command line aborts the server with
      # `FATAL: unrecognized configuration parameter "include_dir"`. postgresql.conf
      # already carries `include_dir = 'conf.d'`, resolved relative to its own directory,
      # so conf.d is loaded by the file — which is also how the Ansible role does it.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      # Faster restores; a drill database is throwaway by definition.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "${PGPORT:-55432}:5432"
    volumes:
      # postgres:18+ refuses to start against a mount at /var/lib/postgresql/data: the
      # images moved to major-version-specific subdirectories under /var/lib/postgresql
      # so that pg_upgrade --link does not straddle a mount boundary. Mounting the parent
      # is what 18 asks for, and it is not optional — the old path aborts the container
      # with "there appears to be PostgreSQL data in /var/lib/postgresql/data (unused
      # mount/volume)", which reads like a leftover-data problem and is not one.
      - pgdata:/var/lib/postgresql
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/conf.d:/etc/postgresql/conf.d:ro
      # Dumps dropped here are visible to pg_restore inside the container.
      - ./dumps:/dumps
    shm_size: 1gb
    healthcheck:
      # -h localhost forces TCP. The entrypoint's bootstrap server — unix socket only,
      # listen_addresses='' — satisfies a socket probe while it applies init scripts,
      # then goes away; `docker compose up -d --wait` would report healthy against it,
      # exactly the false positive load-drill.sh's own loop had. Both probes now mean
      # the real server. start_period keeps initdb from burning the retries.
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER:-postgres} -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 20s
    # A drill that OOMs tells you nothing about connections. Cap deliberately,
    # and keep the cap above shared_buffers + max_connections * work_mem worst case.
    deploy:
      resources:
        limits:
          memory: ${PG_MEMORY_LIMIT:-4g}

volumes:
  pgdata:
