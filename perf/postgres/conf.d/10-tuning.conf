# Drill-box tuning — the mirror of roles/postgres/templates/tuning.conf.j2.
#
# The point of this file is that it is NOT independent: every value below has a
# counterpart the Ansible role renders on the real host, and a drill is only
# worth reading when the two agree. load-drill.sh compares max_connections
# against the inventory and refuses to run on a mismatch, because that is the
# one number the whole drill is about.
#
# The RAM-derived values are for a 4 GB drill container (PG_MEMORY_LIMIT).
# The role derives them from the host's real RAM, so when you drill against a
# clone of the production VM, use the clone's own rendered file instead of this
# one — see README.md, "Two environments".

# ── The number under test ─────────────────────────────────────────────────────
# Policy, not RAM. Sized from the per-app Npgsql pool budget doubled for the
# blue/green drain, plus headroom for psql/monitoring/backup. Keep in lockstep
# with postgres_max_connections in inventory/group_vars/all/main.yml.
max_connections = 400

# Slots held back for superusers. Postgres' own default; stated here because
# the drill's headroom arithmetic subtracts it. Note what it does NOT buy while
# the application connects as `postgres`: the reservation is unenforced for
# superusers, so a saturated app can still take these three and lock the
# operator out of the database it saturated. Per-application roles fix that;
# the drill reports the arithmetic either way.
superuser_reserved_connections = 3

# ── RAM-derived (4 GB drill container) ────────────────────────────────────────
shared_buffers = 1GB                  # 25% of RAM
effective_cache_size = 3GB            # 75% of RAM
work_mem = 32MB                       # per sort/hash NODE, not per connection
maintenance_work_mem = 1GB

# ── Fixed, identical to production ────────────────────────────────────────────
max_wal_size = 4GB
random_page_cost = 1.1
effective_io_concurrency = 200
wal_compression = lz4

# pg_stat_statements is what turns "the pool saturated" into "this query held
# it". It used to be drill-only; the role now preloads it on the real host too,
# so a drill and an incident are read with the same tool.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = top

log_min_duration_statement = 1000
log_lock_waits = on
log_temp_files = 8MB
idle_in_transaction_session_timeout = 5min
