# Minimal base config for the drill container. Everything that matters to the
# test lives in conf.d/10-tuning.conf, mirroring the layout the Ansible postgres
# role installs on a real host (roles/postgres/templates/tuning.conf.j2).
#
# Keep this file boring. If you find yourself tuning here, you are tuning
# something production does not have.

listen_addresses = '*'
port = 5432

# The container image's defaults for these are fine and irrelevant to the drill.
dynamic_shared_memory_type = posix
log_timezone = 'UTC'
timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
default_text_search_config = 'pg_catalog.english'

# Log every connection refusal and every fatal, because "too many clients" is
# one of the two answers this whole exercise exists to catch.
log_connections = on
log_disconnections = off
log_min_messages = warning
log_min_error_statement = error
log_line_prefix = '%m [%p] %q%u@%d '

# Statements slower than this land in the log — the other half of a pool
# diagnosis: a pool saturates because queries got slow, not because it shrank.
log_min_duration_statement = 500

include_dir = 'conf.d'
